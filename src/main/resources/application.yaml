server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: meerkatgram-v2-scg
    version: v1
  web:
    error:
      include-stacktrace: always
      include-message: always
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestSize
              args:
                maxSize: 20MB
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${CORS_ALLOW_ORIGIN}
                allowed-methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
                allowed-headers:
                  - "*"
                allow-credentials: true
          routes:
            - id: ${AUTH_SERVICE_NAME}
              uri: ${AUTH_SERVICE_URI}
              predicates:
                - Path=/${AUTH_SERVICE_NAME}${AUTH_SERVICE_OPEN_API_PATH}, ${AUTH_SERVICE_PREDICATE}
            - id: ${POST_SERVICE_NAME}
              uri: ${POST_SERVICE_URI}
              predicates:
                - Path=/${POST_SERVICE_NAME}${POST_SERVICE_OPEN_API_PATH}, ${POST_SERVICE_PREDICATE}
              filters:
                - RewritePath=/${POST_SERVICE_NAME}${POST_SERVICE_OPEN_API_PATH}, ${POST_SERVICE_OPEN_API_PATH}

# Open API
springdoc:
  swagger-ui:
    path: /docs
    urls:
      - name: ${AUTH_SERVICE_NAME}
        url: /${AUTH_SERVICE_NAME}${AUTH_SERVICE_OPEN_API_PATH}
      - name: ${POST_SERVICE_NAME}
        url: /${POST_SERVICE_NAME}${POST_SERVICE_OPEN_API_PATH}

#jwt
jwt:
  header-key: Authorization
  scheme: Bearer
  secret: ${JWT_SECRET}